architecture:
  style:
    - modular
    - microservice_ready
    - event_driven

  backend:
    api_first: true
    domain_driven: true

  platform:
    multi_tenant: true
    configuration_driven: true
    metadata_driven: true

  observability:
    logging_required: true
    metrics_required: true
    tracing_required: true
    error_code_required: true

  testing:
    unit: required
    integration: required
    end_to_end: required
