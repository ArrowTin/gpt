project:
  name: ChannelHub Enterprise Blueprint
  version: 1.0
  type: enterprise-documentation
  purpose: Single Source of Truth untuk pembangunan ekosistem ChannelHub.

repository:
  default_branch: main
  documentation_first: true

principles:
  - configuration_driven
  - metadata_driven
  - domain_driven_design
  - modular_architecture
  - microservice_ready
  - api_first
  - event_driven
  - observability_first
  - security_by_design

rules:
  no_random_file_creation: true
  maintain_document_consistency: true
  architecture_changes_require_adr: true
  check_existing_documents_before_creation: true
